services:
  db:
    image: mysql:9.7.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: conf_in
      MYSQL_USER: conf_in
      MYSQL_PASSWORD: conf_in_local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uconf_in", "-pconf_in_local", "conf_in", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    command: ["sh", "-c", "bin/rails db:prepare && exec bin/rails server -b 0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql2://conf_in:conf_in_local@db/conf_in?encoding=utf8mb4
      APP_HOST: ${APP_HOST:-localhost:3000}
      APP_PROTOCOL: ${APP_PROTOCOL:-http}
      GMAIL_DOMAIN: ${GMAIL_DOMAIN:-localhost}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}

volumes:
  mysql_data:
