default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "sqlite3:db/test.sqlite3").to_json %>

production:
  <<: *default
  database: db/production.sqlite3
